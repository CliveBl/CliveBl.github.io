<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="הערות גרסה ועדכונים באתר" />
    <link rel="canonical" href="https://www.taxesil.top/release_notes.html" />
    <link rel="icon" type="image/x-icon" href="tax-day2.ico" />
    <title>הערות גרסה</title>
    <link rel="stylesheet" href="css/index.css" />
    <style>
      .release-header {
        border-bottom: 2px solid var(--border-color);
        margin-bottom: 24px;
        padding-bottom: 12px;
      }

      .release-header h1 {
        margin: 0 0 10px;
        color: var(--tax-blue);
      }

      .release-header p {
        margin: 0;
      }

      .release-card {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: 0 2px 10px var(--modal-shadow);
        padding: 18px;
        margin-bottom: 16px;
      }

      .release-card h2 {
        margin: 0 0 8px;
        color: var(--tax-blue);
      }

      .release-meta {
        margin: 0 0 12px;
        color: var(--text-color);
        opacity: 0.85;
        font-size: 0.95rem;
      }

      .release-card ul {
        margin: 0;
        padding-right: 20px;
      }

      .release-card li {
        margin-bottom: 8px;
        line-height: 1.5;
      }

    </style>
  </head>
  <body>
    {% include auth-header.html %}

    <main class="main-container">
      <header class="release-header">
        <h1>הערות גרסה</h1>
        <p>עמוד זה מציג עדכונים ושינויים משמעותיים במערכת.</p>
      </header>

      <section class="instructions-section release-card">
        <h2>גרסה 2026.08.03</h2>
        <p class="release-meta">תאריך שחרור: 03/08/2026</p>
        <ul>
          <li>נוסף עמוד ייעודי להערות גרסה.</li>
          <li>נוסף קישור לעמוד הערות הגרסה מהעמוד הראשי.</li>
        </ul>
      </section>

      <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <a href="index.html" class="stnd-link">לדף הבית</a>
        <a href="help.html" class="stnd-link" style="margin-right: 10px;">עזרה</a>
        <a href="faq.html" class="stnd-link" style="margin-right: 10px;">שאלות נפוצות</a>
        <a href="accessibility_declaration.html" class="stnd-link" style="margin-right: 10px;">הצהרת נגישות</a>
      </div>
    </main>
  </body>
</html>
